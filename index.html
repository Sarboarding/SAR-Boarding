<!DOCTYPE html>

<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAR - Passenger Station Report</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f3f4f6;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
color:#111
}

.app{
max-width:650px;
margin:auto;
padding:14px
}

.card{
background:white;
border-radius:18px;
padding:16px;
box-shadow:0 2px 12px rgba(0,0,0,.08);
margin-bottom:14px
}

h1{
font-size:21px;
margin:0 0 18px;
text-align:center
}

h2{
font-size:17px;
margin:18px 0 10px
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

label{
font-size:13px;
font-weight:700
}

input,select{
width:100%;
margin-top:5px;
padding:12px;
border:1px solid #d5d9de;
border-radius:10px;
font-size:16px;
background:#fff
}

.full{
grid-column:1/-1
}

.station-select-box{
border:1px solid #ddd;
border-radius:13px;
padding:13px;
margin-top:12px;
background:#fafafa
}

.station-select-title{
font-size:15px;
font-weight:800;
margin-bottom:10px
}

.station-list{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.station-option{
display:flex;
align-items:center;
gap:8px;
background:white;
border:1px solid #ddd;
border-radius:10px;
padding:10px;
font-size:14px;
font-weight:700;
cursor:pointer
}

.station-option input{
width:20px;
height:20px;
margin:0;
cursor:pointer
}

.station{
border:1px solid #ddd;
border-radius:13px;
padding:12px;
margin:10px 0;
background:white
}

.station-title{
font-size:16px;
font-weight:800;
margin-bottom:9px
}

.output{
width:100%;
min-height:380px;
padding:13px;
border:1px solid #ccc;
border-radius:12px;
font-size:15px;
line-height:1.55;
direction:ltr;
text-align:left;
white-space:pre-wrap;
background:#fafafa
}

.copy{
width:100%;
border:0;
border-radius:12px;
padding:12px;
font-size:16px;
font-weight:700;
background:#128c7e;
color:white;
margin-top:10px;
cursor:pointer
}

.note{
font-size:12px;
color:#666;
margin-top:8px;
text-align:center
}

.hidden{
display:none
}
</style>

</head>

<body>

<div class="app">

<div class="card">

<h1>🇸🇦 SAR — Passenger Station Report</h1>

<div class="grid">

<label>
Date
<input id="m_date" type="date">
</label>

<label>
Train Number
<select id="m_train"></select>
</label>

<label>
Departure Station
<select id="m_from"></select>
</label>

<label>
Departure Time
<input id="m_time" type="time" value="18:00">
</label>

</div>

<h2>Arrival Stations</h2>

<div class="station-select-box">

<div class="station-select-title">
Select the stations you want to include in the report
</div>

<div class="station-list">

<label class="station-option">
<input type="checkbox" class="station-check" value="Riyadh" data-id="r">
Riyadh
</label>

<label class="station-option">
<input type="checkbox" class="station-check" value="Al-Majma'ah" data-id="m">
Al-Majma'ah
</label>

<label class="station-option">
<input type="checkbox" class="station-check" value="Al-Qassim" data-id="q">
Al-Qassim
</label>

<label class="station-option">
<input type="checkbox" class="station-check" value="Hail" data-id="ha">
Hail
</label>

<label class="station-option">
<input type="checkbox" class="station-check" value="Al-Jouf" data-id="j">
Al-Jouf
</label>

<label class="station-option">
<input type="checkbox" class="station-check" value="Al-Qurayyat" data-id="c">
Al-Qurayyat
</label>

<label class="station-option">
<input type="checkbox" class="station-check" value="Dammam" data-id="d">
Dammam
</label>

<label class="station-option">
<input type="checkbox" class="station-check" value="Buqayq" data-id="bq">
Buqayq
</label>

<label class="station-option">
<input type="checkbox" class="station-check" value="Al-Hofuf" data-id="h">
Al-Hofuf
</label>

</div>
</div>

<div id="stationFields"></div>

<h2>📱 WhatsApp Report</h2>

<textarea id="output" class="output" readonly></textarea>

<button class="copy" onclick="copyReport()">
📋 Copy Report
</button>

<div id="status" class="note">
Tap "Copy Report" and paste directly into WhatsApp.
</div>

</div>
</div>

<script>

const stations=[
{
name:"Riyadh",
id:"r"
},
{
name:"Al-Majma'ah",
id:"m"
},
{
name:"Al-Qassim",
id:"q"
},
{
name:"Hail",
id:"ha"
},
{
name:"Al-Jouf",
id:"j"
},
{
name:"Al-Qurayyat",
id:"c"
},
{
name:"Dammam",
id:"d"
},
{
name:"Buqayq",
id:"bq"
},
{
name:"Al-Hofuf",
id:"h"
}
];


function fillSelect(id,max,selected=0){

const x=document.getElementById(id);

for(let i=0;i<=max;i++){

const o=document.createElement("option");

o.value=i;
o.textContent=i;

if(i===selected){
o.selected=true;
}

x.appendChild(o);

}

}


function fillStations(id,selected){

const x=document.getElementById(id);

stations.forEach(s=>{

const o=document.createElement("option");

o.value=s.name;
o.textContent=s.name;

if(s.name===selected){
o.selected=true;
}

x.appendChild(o);

});

}


function v(id){

return document.getElementById(id).value||"";

}


function n(id){

return Number(v(id))||0;

}


function d(id){

const x=v(id);

if(!x)return "";

const p=x.split("-");

return p.length===3
?`${p[2]}/${p[1]}/${p[0]}`
:x;

}


function createStationFields(){

const container=document.getElementById("stationFields");

container.innerHTML="";

stations.forEach(s=>{

const div=document.createElement("div");

div.className="station hidden";

div.id="station_"+s.id;

div.innerHTML=`

<div class="station-title">
📍 ${s.name}
</div>

<div class="grid">

<label>
Business
<select id="${s.id}_b"></select>
</label>

<label>
Economy
<select id="${s.id}_e"></select>
</label>

<label>
Waiting
<select id="${s.id}_w"></select>
</label>

<label>
Baggage
<select id="${s.id}_g"></select>
</label>

<label>
Shipment
<select id="${s.id}_s"></select>
</label>

</div>
`;

container.appendChild(div);

fillSelect(s.id+"_b",450);
fillSelect(s.id+"_e",450);
fillSelect(s.id+"_w",20);
fillSelect(s.id+"_g",200);
fillSelect(s.id+"_s",150);

});

}


function updateSelectedStations(){

document.querySelectorAll(".station-check").forEach(check=>{

const stationId=check.dataset.id;

const box=document.getElementById("station_"+stationId);

if(box){

if(check.checked){
box.classList.remove("hidden");
}else{
box.classList.add("hidden");
}

}

});

update();

}


function multiText(){

let total=0;
let bags=0;
let shipments=0;
let body="";

const selectedStations=
document.querySelectorAll(".station-check:checked");


selectedStations.forEach(check=>{

const stationName=check.value;
const id=check.dataset.id;

const b=n(id+"_b");
const e=n(id+"_e");
const w=n(id+"_w");
const g=n(id+"_g");
const s=n(id+"_s");

const stationTotal=b+e+w;

total+=stationTotal;
bags+=g;
shipments+=s;

body+=`📍 ${stationName}

💺 Business: ${b}
🪑 Economy: ${e}
Waiting: ${w}

🧳 Baggage: ${g}
📦 Shipment: ${s}

Total: ${stationTotal}

`;

});


if(!body){

body="No arrival stations selected.\n";

}


return `🇸🇦 Saudi Arabia Railways (SAR)

📋 Passenger Station Report
📍 Departure Station: ${v("m_from")}
${d("m_date")}

🚆 Train: #${v("m_train")}
🕕 Departure: ${v("m_time")}

➡️ Selected Arrival Stations

${body}

👥 Total Passengers: ${total}
🧳 Total Baggage: ${bags}
📦 Total Shipment: ${shipments}

📝 Note:
Baggage car is at the front of the train.`;

}


function update(){

document.getElementById("output").value=multiText();

}


async function copyReport(){

const text=document.getElementById("output").value;

try{

await navigator.clipboard.writeText(text);

document.getElementById("status").textContent=
"✅ Report copied successfully. Open WhatsApp and paste.";

}catch(e){

const x=document.getElementById("output");

x.removeAttribute("readonly");

x.focus();

x.select();

document.execCommand("copy");

x.setAttribute("readonly","readonly");

document.getElementById("status").textContent=
"✅ Report copied successfully. Open WhatsApp and paste.";

}

}


/* Train number 0 - 200 */

fillSelect("m_train",200,39);


/* Departure stations */

fillStations("m_from","Al-Majma'ah");


/* Create all station input fields */

createStationFields();


/* Today's date */

const today=
new Date()
.toISOString()
.split("T")[0];

document.getElementById("m_date").value=today;


/* Station selection */

document.querySelectorAll(".station-check").forEach(check=>{

check.addEventListener("change",updateSelectedStations);

});


/* Update report when values change */

document.addEventListener("input",update);

document.addEventListener("change",update);


/* Initial report */

update();

</script>

</body>
</html>
