<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SAR - Passenger Station Report</title>

<style>
*{box-sizing:border-box}
:root{
  --sar:#008c83;
  --sar-dark:#00766f;
  --sar-soft:#e8f6f4;
  --border:#d8dde2;
  --text:#17202a;
  --muted:#68737d;
  --bg:#f4f6f7;
}
body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
}
.app{
  width:min(100%,900px);
  margin:auto;
  padding:18px 14px 28px;
}
.brand{
  text-align:center;
  margin:2px 0 14px;
}
.sar-logo{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0;
  line-height:.78;
  font-size:78px;
  font-weight:950;
  letter-spacing:-7px;
}
.sar-logo .s,.sar-logo .r{color:#333}
.sar-logo .a{color:#0b9da7;position:relative;margin:0 3px}

.brand-ar{
  font-size:19px;
  font-weight:800;
  margin-top:2px;
  color:#333;
}
.brand-en{
  font-size:15px;
  font-weight:800;
  color:#333;
  margin-top:1px;
}
h1{
  text-align:center;
  color:var(--sar-dark);
  font-size:31px;
  margin:10px 0 20px;
  font-weight:850;
}
.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-shadow:0 2px 14px rgba(0,0,0,.08);
  border:1px solid #eef0f2;
}
.section-title{
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--sar-dark);
  font-size:19px;
  font-weight:850;
  margin:0 0 15px;
}
.icon{
  width:24px;height:24px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px 18px;
}
.field.full{grid-column:1/-1}
label{
  display:block;
  font-size:14px;
  font-weight:750;
  color:#18212a;
}
input,select{
  width:100%;
  height:50px;
  margin-top:7px;
  padding:0 14px;
  border:1px solid #cfd5db;
  border-radius:9px;
  background:#fff;
  color:#17202a;
  font-size:16px;
  outline:none;
  appearance:auto;
}
input:focus,select:focus{
  border-color:var(--sar);
  box-shadow:0 0 0 3px rgba(0,140,131,.12);
}
.subsection{margin-top:23px}
.station-select-box{
  border:1px solid #dce1e5;
  border-radius:10px;
  padding:15px;
  background:#fbfcfc;
}
.station-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px 18px;
}
.station-option{
  display:flex;
  align-items:center;
  gap:10px;
  padding:3px 0;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}
.station-option input{
  width:22px;height:22px;
  margin:0;
  accent-color:var(--sar);
}
.station-fields{margin-top:4px}
.station{
  border:1px solid #dce1e5;
  border-radius:10px;
  padding:14px;
  margin:11px 0;
  background:#fff;
}
.station-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}
.station-title{
  color:var(--sar-dark);
  font-size:17px;
  font-weight:850;
}
.delete{
  width:40px;height:40px;
  border:1px solid #ff9b9b;
  background:#fff;
  color:#ef4444;
  border-radius:8px;
  font-size:20px;
  cursor:pointer;
}
.passenger-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.passenger-grid label{font-size:13px}
.total-input{
  background:#f1f3f4 !important;
  color:var(--sar-dark) !important;
  font-weight:850;
}
.add-station{
  width:100%;
  height:48px;
  border:1px solid var(--sar);
  background:#fff;
  color:var(--sar-dark);
  border-radius:8px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  margin-top:8px;
}
.add-station:active,.copy:active{transform:scale(.99)}
.output-wrap{margin-top:22px}
.output{
  width:100%;
  min-height:255px;
  padding:15px;
  border:1px solid #d4d9de;
  border-radius:9px;
  background:#fbfcfc;
  color:#17202a;
  font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  resize:vertical;
  direction:ltr;
  text-align:left;
  white-space:pre-wrap;
}
.copy{
  width:100%;
  height:52px;
  border:0;
  border-radius:9px;
  background:var(--sar);
  color:#fff;
  font-size:17px;
  font-weight:850;
  cursor:pointer;
  margin-top:12px;
}
.note{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-top:9px;
}
.hidden{display:none!important}

@media(max-width:680px){
  .app{padding:10px 10px 22px}
  .card{padding:15px;border-radius:13px}
  .sar-logo{font-size:65px}
  .brand-ar{font-size:16px}
  .brand-en{font-size:13px}
  h1{font-size:25px;margin:8px 0 16px}
  .section-title{font-size:17px}
  .grid{gap:11px 10px}
  input,select{height:46px;font-size:15px;padding:0 10px}
  .station-list{gap:7px 12px}
  .station-option{font-size:14px}
  .passenger-grid{grid-template-columns:repeat(2,1fr);gap:10px}
}
@media(max-width:420px){
  .station-list{grid-template-columns:1fr 1fr}
  .passenger-grid{grid-template-columns:1fr 1fr}
}

.passenger-grid{grid-template-columns:repeat(3,1fr)}
@media(max-width:620px){.passenger-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<body>
<div class="app">

  <div class="brand">
    <div class="sar-logo" aria-label="SAR"><span class="s">S</span><span class="a">A</span><span class="r">R</span></div>
    <div class="brand-ar">الخطوط الحديدية السعودية</div>
    <div class="brand-en">SAUDI ARABIA RAILWAYS</div>
  </div>

  <h1>Passenger Station Report</h1>

  <div class="card">

    <div class="section-title"><span class="icon">▣</span>Report Details</div>

    <div class="grid">
      <div class="field">
        <label>Date
          <input id="m_date" type="date">
        </label>
      </div>

      <div class="field">
        <label>Day
          <select id="m_day">
            <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
            <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
          </select>
        </label>
      </div>

      <div class="field">
        <label>Train No.
          <select id="m_train"></select>
        </label>
      </div>

      <div class="field">
        <label>Departure Time
          <input id="m_time" type="time" value="18:00">
        </label>
      </div>

      <div class="field full">
        <label>From Station
          <select id="m_from"></select>
        </label>
      </div>
    </div>

    <div class="subsection">
      <div class="section-title"><span class="icon">⌖</span>Arrival Station(s)</div>
      <div class="station-select-box">
        <div class="station-list">
          <label class="station-option"><input type="checkbox" class="station-check" value="Riyadh" data-id="r">Riyadh</label>
          <label class="station-option"><input type="checkbox" class="station-check" value="Hail" data-id="ha">Hail</label>
          <label class="station-option"><input type="checkbox" class="station-check" value="Al-Majma'ah" data-id="m">Al-Majma'ah</label>
          <label class="station-option"><input type="checkbox" class="station-check" value="Al-Qurayyat" data-id="c">Al-Qurayyat</label>
          <label class="station-option"><input type="checkbox" class="station-check" value="Al-Qassim" data-id="q">Al-Qassim</label>
          <label class="station-option"><input type="checkbox" class="station-check" value="Al-Jouf" data-id="j">Al-Jouf</label>
          <label class="station-option"><input type="checkbox" class="station-check" value="Dammam" data-id="d">Dammam</label>
          <label class="station-option"><input type="checkbox" class="station-check" value="Buqayq" data-id="bq">Buqayq</label>
          <label class="station-option"><input type="checkbox" class="station-check" value="Al-Hofuf" data-id="h">Al-Hofuf</label>
        </div>
      </div>
    </div>

    <div class="subsection">
      <div class="section-title"><span class="icon">♧</span>Passenger Data (For Each Station)</div>
      <div id="stationFields" class="station-fields"></div>
      <button class="add-station" type="button" onclick="addNextStation()">＋ &nbsp;Add Station</button>
    </div>

    <div class="output-wrap">
      <div class="section-title"><span class="icon">▤</span>Report Output</div>
      <textarea id="output" class="output" readonly></textarea>
      <button class="copy" onclick="copyReport()">▣ &nbsp; Copy Report</button>
      <div id="status" class="note">Report will be copied to clipboard</div>
    </div>

  </div>
</div>

<script>
const stations=[
  {name:"Riyadh",id:"r"},
  {name:"Al-Majma'ah",id:"m"},
  {name:"Al-Qassim",id:"q"},
  {name:"Hail",id:"ha"},
  {name:"Al-Jouf",id:"j"},
  {name:"Al-Qurayyat",id:"c"},
  {name:"Dammam",id:"d"},
  {name:"Buqayq",id:"bq"},
  {name:"Al-Hofuf",id:"h"}
];

const departureStations=stations.map(s=>s.name);

function fillSelect(id,max,selected=0){
  const x=document.getElementById(id);
  for(let i=0;i<=max;i++){
    const o=document.createElement("option");
    o.value=i;o.textContent=i;
    if(i===selected)o.selected=true;
    x.appendChild(o);
  }
}

function v(id){
  const e=document.getElementById(id);
  return e ? (e.value||"") : "";
}
function n(id){return Number(v(id))||0;}
function d(id){
  const x=v(id); if(!x)return "";
  const p=x.split("-");
  return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : x;
}
function setDay(){
  const x=v("m_date");
  if(!x)return;
  const day=new Date(x+"T12:00:00").toLocaleDateString("en-US",{weekday:"long"});
  document.getElementById("m_day").value=day;
}

function fillDepartureStations(){
  const x=document.getElementById("m_from");
  departureStations.forEach(station=>{
    const o=document.createElement("option");
    o.value=station;o.textContent=station;
    if(station==="Al-Majma'ah")o.selected=true;
    x.appendChild(o);
  });
}

function createStationFields(){
  const container=document.getElementById("stationFields");
  container.innerHTML="";
  stations.forEach(s=>{
    const div=document.createElement("div");
    div.className="station hidden";
    div.id="station_"+s.id;
    div.innerHTML=`
      <div class="station-head">
        <div class="station-title">${stationNumber(s.id)}. ${s.name}</div>
        <button class="delete" type="button" title="Remove station" onclick="removeStation('${s.id}')">♧</button>
      </div>
      <div class="passenger-grid">
        <label>Business<select id="${s.id}_b"></select></label>
        <label>Economy<select id="${s.id}_e"></select></label>
        <label>Waiting<select id="${s.id}_w"></select></label>
        <label>Baggage (شنط)<select id="${s.id}_g"></select></label>
        <label>Shipment (شيبمنت)<select id="${s.id}_s"></select></label>
        <label>Total<input id="${s.id}_t" class="total-input" readonly value="0"></label>
      </div>
    `;
    container.appendChild(div);
    fillSelect(s.id+"_b",450,0);
    fillSelect(s.id+"_e",450,0);
    fillSelect(s.id+"_w",20,0);
    fillSelect(s.id+"_g",200,0);
    fillSelect(s.id+"_s",150,0);

    [s.id+"_b",s.id+"_e",s.id+"_w",s.id+"_g",s.id+"_s"].forEach(id=>{
      document.getElementById(id).addEventListener("change",()=>{calcTotal(s.id);update();});
    });
  });
}

function stationNumber(id){
  const checked=[...document.querySelectorAll(".station-check:checked")].map(x=>x.dataset.id);
  const idx=checked.indexOf(id);
  return idx>=0 ? idx+1 : stations.findIndex(s=>s.id===id)+1;
}

function calcTotal(id){
  const total=n(id+"_b")+n(id+"_e")+n(id+"_w");
  const el=document.getElementById(id+"_t");
  if(el)el.value=total;
  return total;
}

function updateStationTitles(){
  const checked=[...document.querySelectorAll(".station-check:checked")].map(x=>x.dataset.id);
  checked.forEach((id,i)=>{
    const s=stations.find(x=>x.id===id);
    const el=document.querySelector("#station_"+id+" .station-title");
    if(el)el.textContent=`${i+1}. ${s.name}`;
  });
}

function updateSelectedStations(){
  document.querySelectorAll(".station-check").forEach(check=>{
    const box=document.getElementById("station_"+check.dataset.id);
    if(!box)return;
    box.classList.toggle("hidden",!check.checked);
    if(check.checked)calcTotal(check.dataset.id);
  });
  updateStationTitles();
  update();
}

function removeStation(id){
  const check=document.querySelector(`.station-check[data-id="${id}"]`);
  if(check){check.checked=false;updateSelectedStations();}
}

function addNextStation(){
  const next=document.querySelector(".station-check:not(:checked)");
  if(next){
    next.checked=true;
    updateSelectedStations();
    const box=document.getElementById("station_"+next.dataset.id);
    if(box)box.scrollIntoView({behavior:"smooth",block:"center"});
  }
}

function multiText(){
  let body="";
  const selected=[...document.querySelectorAll(".station-check:checked")];

  selected.forEach((check,i)=>{
    const id=check.dataset.id;
    const business=n(id+"_b");
    const economy=n(id+"_e");
    const waiting=n(id+"_w");
    const baggage=n(id+"_g");
    const shipment=n(id+"_s");
    const total=business+economy+waiting;

    body+=`📍 ${check.value}

💺 Business: ${business}
🎟️ Economy: ${economy}
Waiting: ${waiting}

🧳 Baggage: ${baggage}
📦 Shipment: ${shipment}

Total Passengers: ${total}

`;
  });

  if(!body) body="⚠ No arrival stations selected.\n";

  return `🇸🇦 Saudi Arabia Railways (SAR)

📋 Passenger Station Report

📍 Departure Station: ${v("m_from")}
${d("m_date")}    ${v("m_day")}

🚆 Train: #${v("m_train")}
🕕 Departure: ${v("m_time")}

➡️ Arrival Stations

${body}
📝 Note:
Baggage car is at the rear of the train.`;
}
function update(){document.getElementById("output").value=multiText();}

async function copyReport(){
  const text=document.getElementById("output").value;
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const x=document.getElementById("output");
    x.removeAttribute("readonly");x.focus();x.select();
    document.execCommand("copy");x.setAttribute("readonly","readonly");
  }
  document.getElementById("status").textContent="✓ Report copied successfully. Open WhatsApp and paste.";
}

fillSelect("m_train",200,39);
fillDepartureStations();
createStationFields();

const today=new Date().toISOString().split("T")[0];
document.getElementById("m_date").value=today;
setDay();

document.getElementById("m_date").addEventListener("change",()=>{setDay();update();});
document.getElementById("m_day").addEventListener("change",update);
document.getElementById("m_time").addEventListener("change",update);
document.getElementById("m_train").addEventListener("change",update);
document.getElementById("m_from").addEventListener("change",update);

document.querySelectorAll(".station-check").forEach(check=>{
  check.addEventListener("change",updateSelectedStations);
});

update();
</script>
</body>
</html>
