```html
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAR - Passenger Station Report</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f3f4f6;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
color:#111
}

.app{
max-width:650px;
margin:auto;
padding:14px
}

.card{
background:white;
border-radius:18px;
padding:16px;
box-shadow:0 2px 12px rgba(0,0,0,.08);
margin-bottom:14px
}

h1{
font-size:21px;
margin:0 0 18px;
text-align:center
}

h2{
font-size:17px;
margin:18px 0 10px
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

label{
font-size:13px;
font-weight:700
}

input,select{
width:100%;
margin-top:5px;
padding:12px;
border:1px solid #d5d9de;
border-radius:10px;
font-size:16px;
background:#fff
}

.full{
grid-column:1/-1
}

/* Arrival station selection */

.station-select-box{
border:1px solid #ddd;
border-radius:13px;
padding:13px;
margin-top:12px;
background:#fafafa
}

.station-select-title{
font-size:15px;
font-weight:800;
margin-bottom:10px
}

.station-list{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.station-option{
display:flex;
align-items:center;
gap:8px;
background:white;
border:1px solid #ddd;
border-radius:10px;
padding:10px;
font-size:14px;
font-weight:700;
cursor:pointer
}

.station-option input{
width:20px;
height:20px;
margin:0;
cursor:pointer
}

/* Station data */

.station{
border:1px solid #ddd;
border-radius:13px;
padding:12px;
margin:10px 0;
background:white
}

.station-title{
font-size:16px;
font-weight:800;
margin-bottom:9px
}

.output{
width:100%;
min-height:400px;
padding:13px;
border:1px solid #ccc;
border-radius:12px;
font-size:15px;
line-height:1.55;
direction:ltr;
text-align:left;
white-space:pre-wrap;
background:#fafafa
}

.copy{
width:100%;
border:0;
border-radius:12px;
padding:12px;
font-size:16px;
font-weight:700;
background:#128c7e;
color:white;
margin-top:10px;
cursor:pointer
}

.note{
font-size:12px;
color:#666;
margin-top:8px;
text-align:center
}

.hidden{
display:none
}
</style>
</head>

<body>

<div class="app">

<div class="card">

<h1>🇸🇦 SAR — Passenger Station Report</h1>

<!-- Main Report Information -->

<div class="grid">

<label>
Date
<input id="m_date" type="date">
</label>

<label>
Train Number
<select id="m_train"></select>
</label>

<label>
Departure Station
<select id="m_from"></select>
</label>

<label>
Departure Time
<input id="m_time" type="time" value="18:00">
</label>

</div>


<!-- Arrival Stations -->

<h2>Arrival Stations</h2>

<div class="station-select-box">

<div class="station-select-title">
Select the stations you want to include in the report
</div>

<div class="station-list">

<label class="station-option">
<input type="checkbox" class="station-check"
value="Riyadh" data-id="r">
Riyadh
</label>

<label class="station-option">
<input type="checkbox" class="station-check"
value="Al-Majma'ah" data-id="m">
Al-Majma'ah
</label>

<label class="station-option">
<input type="checkbox" class="station-check"
value="Al-Qassim" data-id="q">
Al-Qassim
</label>

<label class="station-option">
<input type="checkbox" class="station-check"
value="Hail" data-id="ha">
Hail
</label>

<label class="station-option">
<input type="checkbox" class="station-check"
value="Al-Jouf" data-id="j">
Al-Jouf
</label>

<label class="station-option">
<input type="checkbox" class="station-check"
value="Al-Qurayyat" data-id="c">
Al-Qurayyat
</label>

<label class="station-option">
<input type="checkbox" class="station-check"
value="Dammam" data-id="d">
Dammam
</label>

<label class="station-option">
<input type="checkbox" class="station-check"
value="Buqayq" data-id="bq">
Buqayq
</label>

<label class="station-option">
<input type="checkbox" class="station-check"
value="Al-Hofuf" data-id="h">
Al-Hofuf
</label>

</div>
</div>


<!-- Station Input Fields -->

<div id="stationFields"></div>


<!-- WhatsApp Report -->

<h2>📱 WhatsApp Report</h2>

<textarea id="output" class="output" readonly></textarea>

<button class="copy" onclick="copyReport()">
📋 Copy Report
</button>

<div id="status" class="note">
Tap "Copy Report" and paste directly into WhatsApp.
</div>

</div>
</div>


<script>

/* =====================================================
   STATIONS
===================================================== */

const stations=[

{
name:"Riyadh",
id:"r"
},

{
name:"Al-Majma'ah",
id:"m"
},

{
name:"Al-Qassim",
id:"q"
},

{
name:"Hail",
id:"ha"
},

{
name:"Al-Jouf",
id:"j"
},

{
name:"Al-Qurayyat",
id:"c"
},

{
name:"Dammam",
id:"d"
},

{
name:"Buqayq",
id:"bq"
},

{
name:"Al-Hofuf",
id:"h"
}

];


/* =====================================================
   CREATE NUMBER SELECT
===================================================== */

function fillSelect(id,max,selected=0){

const x=document.getElementById(id);

for(let i=0;i<=max;i++){

const o=document.createElement("option");

o.value=i;
o.textContent=i;

if(i===selected){
o.selected=true;
}

x.appendChild(o);

}

}


/* =====================================================
   GET VALUE
===================================================== */

function v(id){

const element=document.getElementById(id);

if(!element){
return "";
}

return element.value || "";

}


/* =====================================================
   GET NUMBER
===================================================== */

function n(id){

return Number(v(id)) || 0;

}


/* =====================================================
   DATE FORMAT
===================================================== */

function d(id){

const x=v(id);

if(!x){
return "";
}

const p=x.split("-");

return p.length===3
?`${p[2]}/${p[1]}/${p[0]}`
:x;

}


/* =====================================================
   DEPARTURE STATIONS
===================================================== */

const departureStations=[
"Riyadh",
"Al-Majma'ah",
"Al-Qassim",
"Hail",
"Al-Jouf",
"Al-Qurayyat",
"Dammam",
"Buqayq",
"Al-Hofuf"
];


function fillDepartureStations(){

const x=document.getElementById("m_from");

departureStations.forEach(station=>{

const o=document.createElement("option");

o.value=station;
o.textContent=station;

if(station==="Al-Majma'ah"){
o.selected=true;
}

x.appendChild(o);

});

}


/* =====================================================
   CREATE STATION FIELDS
===================================================== */

function createStationFields(){

const container=document.getElementById("stationFields");

container.innerHTML="";

stations.forEach(s=>{

const div=document.createElement("div");

div.className="station hidden";

div.id="station_"+s.id;

div.innerHTML=`

<div class="station-title">
📍 ${s.name}
</div>

<div class="grid">

<label>
Business
<select id="${s.id}_b"></select>
</label>

<label>
Economy
<select id="${s.id}_e"></select>
</label>

<label>
Waiting
<select id="${s.id}_w"></select>
</label>

<label>
Baggage
<select id="${s.id}_g"></select>
</label>

<label>
Shipment
<select id="${s.id}_s"></select>
</label>

</div>
`;

container.appendChild(div);


/* Business 0 - 450 */

fillSelect(
s.id+"_b",
450,
0
);


/* Economy 0 - 450 */

fillSelect(
s.id+"_e",
450,
0
);


/* Waiting 0 - 20 */

fillSelect(
s.id+"_w",
20,
0
);


/* Baggage 0 - 200 */

fillSelect(
s.id+"_g",
200,
0
);


/* Shipment 0 - 150 */

fillSelect(
s.id+"_s",
150,
0
);

});

}


/* =====================================================
   SHOW / HIDE SELECTED STATIONS
===================================================== */

function updateSelectedStations(){

document.querySelectorAll(".station-check")
.forEach(check=>{

const stationId=check.dataset.id;

const box=document.getElementById(
"station_"+stationId
);

if(!box){
return;
}

if(check.checked){

box.classList.remove("hidden");

}else{

box.classList.add("hidden");

}

});

update();

}


/* =====================================================
   CREATE REPORT
===================================================== */

function multiText(){

let totalPassengers=0;

let totalBusiness=0;

let totalEconomy=0;

let totalWaiting=0;

let totalBaggage=0;

let totalShipment=0;

let body="";


const selectedStations=
document.querySelectorAll(
".station-check:checked"
);


/* Selected stations only */

selectedStations.forEach(check=>{

const stationName=check.value;

const id=check.dataset.id;


const business=n(id+"_b");

const economy=n(id+"_e");

const waiting=n(id+"_w");

const baggage=n(id+"_g");

const shipment=n(id+"_s");


const stationTotal=
business+
economy+
waiting;


totalBusiness+=business;

totalEconomy+=economy;

totalWaiting+=waiting;

totalPassengers+=stationTotal;

totalBaggage+=baggage;

totalShipment+=shipment;


/* Station report */

body+=`📍 ${stationName}

💺 Business: ${business}
🪑 Economy: ${economy}
Waiting: ${waiting}

🧳 Baggage: ${baggage}
📦 Shipment: ${shipment}

Total Passengers: ${stationTotal}

`;

});


/* No station selected */

if(!body){

body=
"⚠️ No arrival stations selected.\n";

}


/* Final report */

return `🇸🇦 Saudi Arabia Railways (SAR)

📋 Passenger Station Report

📍 Departure Station: ${v("m_from")}
${d("m_date")}

🚆 Train: #${v("m_train")}
🕕 Departure: ${v("m_time")}

➡️ Arrival Stations

${body}

━━━━━━━━━━━━━━━━━━

👥 TOTAL PASSENGERS: ${totalPassengers}

💺 Total Business: ${totalBusiness}
🪑 Total Economy: ${totalEconomy}
Waiting: ${totalWaiting}

🧳 Total Baggage: ${totalBaggage}
📦 Total Shipment: ${totalShipment}

📝 Note:
Baggage car is at the front of the train.`;

}


/* =====================================================
   UPDATE REPORT
===================================================== */

function update(){

document.getElementById("output").value=
multiText();

}


/* =====================================================
   COPY REPORT
===================================================== */

async function copyReport(){

const text=
document.getElementById("output").value;


try{

await navigator.clipboard.writeText(text);

document.getElementById("status")
.textContent=
"✅ Report copied successfully. Open WhatsApp and paste.";

}catch(e){

const x=
document.getElementById("output");

x.removeAttribute("readonly");

x.focus();

x.select();

document.execCommand("copy");

x.setAttribute("readonly","readonly");

document.getElementById("status")
.textContent=
"✅ Report copied successfully. Open WhatsApp and paste.";

}

}


/* =====================================================
   INITIAL SETUP
===================================================== */


/* Train number 0 - 200 */

fillSelect(
"m_train",
200,
39
);


/* Departure stations */

fillDepartureStations();


/* Create all station fields */

createStationFields();


/* Today's date */

const today=
new Date()
.toISOString()
.split("T")[0];

document.getElementById("m_date")
.value=today;


/* Station selection */

document.querySelectorAll(
".station-check"
).forEach(check=>{

check.addEventListener(
"change",
updateSelectedStations
);

});


/* Update whenever user changes numbers */

document.addEventListener(
"input",
update
);

document.addEventListener(
"change",
update
);


/* Initial report */

update();

</script>

</body>
</html>
```
