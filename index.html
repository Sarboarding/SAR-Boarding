*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#111}
.app{max-width:650px;margin:auto;padding:14px}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 12px #00000014}
h1{text-align:center;font-size:21px;margin:0 0 15px}
h2{font-size:17px;margin:16px 0 10px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
button{border:0;border-radius:12px;padding:12px;font-size:16px;font-weight:700}
.tab{flex:1;background:#e6e9ed}.tab.active{background:#222;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;font-weight:700}
input,select{width:100%;margin-top:5px;padding:12px;border:1px solid #d5d9de;border-radius:10px;font-size:16px;background:#fff}
.full{grid-column:1/-1}
.station{border:1px solid #ddd;border-radius:13px;padding:12px;margin:10px 0}
.station-title{font-size:16px;font-weight:800;margin-bottom:9px}
.output{width:100%;min-height:330px;padding:13px;border:1px solid #ccc;border-radius:12px;font-size:15px;line-height:1.55;direction:ltr;text-align:left;white-space:pre-wrap;background:#fafafa}
.copy{width:100%;background:#128c7e;color:#fff;margin-top:10px}
.note{font-size:12px;color:#666;margin-top:8px;text-align:center}
.hidden{display:none}
</style>
</head>

<h2>📱 النص الجاهز للواتساب</h2>

<textarea id="output" class="output" readonly></textarea>

<button class="copy" onclick="copyReport()">📋 نسخ النص</button>

اضغط «نسخ النص» ثم الصق مباشرة في واتساب.
</div>

<script>

function fillSelect(id,max,selected=0){

let x=document.getElementById(id);

for(let i=0;i<=max;i++){

let o=document.createElement("option");

o.value=i;
o.textContent=i;

if(i===selected)o.selected=true;

x.appendChild(o);

}

}


const stations=[
"Riyadh",
"Dammam",
"Al Jouf",
"Al Hofuf",
"Hail",
"Qassim",
"Al Qurayyat",
"Majmaah",
"Buqaiq"
];


function fillStations(id,selected){

let x=document.getElementById(id);

stations.forEach(s=>{

let o=document.createElement("option");

o.value=s;
o.textContent=s;

if(s===selected)o.selected=true;

x.appendChild(o);

});

}


function v(id){

return document.getElementById(id).value||"";

}


function n(id){

return Number(v(id))||0;

}


function d(id){

let x=v(id);

if(!x)return "";

let p=x.split("-");

return p.length===3
?`${p[2]}/${p[1]}/${p[0]}`
:x;

}


/* تقرير الرحلة */

function singleText(){

let total=n("s_b")+n("s_e")+n("s_w");

return `🇸🇦 Saudi Arabia Railways (SAR)

📋 Departure Report
📍 ${v("s_from")} Station
${d("s_date")}

🚆 Train: #${v("s_train")}
➡️ ${v("s_from")} → ${v("s_to")}
🕖 Departure: ${v("s_time")}

👥 Passengers
💺 Business: ${n("s_b")}
🪑 Economy: ${n("s_e")}
Waiting: ${n("s_w")}
Total: ${total}

🧳 Baggage: ${n("s_g")}
📦 Shipment: ${n("s_s")}

📝 Note:
Baggage car is at the front of the train.`;

}


/* تقرير المحطات */

function multiText(){

let rows=[

["Riyadh","r_b","r_e","r_w","r_g","r_s"],
["Dammam","d_b","d_e","d_w","d_g","d_s"],
["Al Jouf","j_b","j_e","j_w","j_g","j_s"],
["Al Hofuf","h_b","h_e","h_w","h_g","h_s"],
["Hail","ha_b","ha_e","ha_w","ha_g","ha_s"],
["Qassim","q_b","q_e","q_w","q_g","q_s"],
["Al Qurayyat","c_b","c_e","c_w","c_g","c_s"],
["Majmaah","m_b","m_e","m_w","m_g","m_s"],
["Buqaiq","b_b","b_e","b_w","b_g","b_s"]

];

let total=0;
let bags=0;
let shipments=0;

let body="";


rows.forEach(r=>{

let b=n(r[1]);
let e=n(r[2]);
let w=n(r[3]);
let g=n(r[4]);
let s=n(r[5]);

let t=b+e+w;

total+=t;
bags+=g;
shipments+=s;

body+=`📍 ${r[0]}
💺 Business: ${b}
🪑 Economy: ${e}
Waiting: ${w}
🧳 Baggage: ${g}
📦 Shipment: ${s}
Total: ${t}

`;

});


return `🇸🇦 Saudi Arabia Railways (SAR)

📋 Passenger Destination Report
📍 Majmaah Station
${d("m_date")}

🚆 Train: #${v("m_train")}
🕕 Departure: ${v("m_time")}

👥 Passengers by Destination

${body}👥 Total Passengers: ${total}
🧳 Total Baggage: ${bags}
📦 Total Shipment: ${shipments}`;

}


function update(){

document.getElementById("output").value=

document.getElementById("multi").classList.contains("hidden")

?singleText()

:multiText();

}


function showSingle(){

document.getElementById("single").classList.remove("hidden");

document.getElementById("multi").classList.add("hidden");

document.getElementById("tab1").classList.add("active");

document.getElementById("tab2").classList.remove("active");

update();

}


function showMulti(){

document.getElementById("single").classList.add("hidden");

document.getElementById("multi").classList.remove("hidden");

document.getElementById("tab1").classList.remove("active");

document.getElementById("tab2").classList.add("active");

update();

}


async function copyReport(){

let text=document.getElementById("output").value;

try{

await navigator.clipboard.writeText(text);

document.getElementById("status").textContent=
"✅ تم النسخ كنص. افتح واتساب والصق.";

}catch(e){

let x=document.getElementById("output");

x.removeAttribute("readonly");

x.focus();

x.select();

document.execCommand("copy");

x.setAttribute("readonly","readonly");

document.getElementById("status").textContent=
"✅ تم النسخ كنص. افتح واتساب والصق.";

}

}


/* أرقام القطارات 0 - 200 */

fillSelect("s_train",200,39);
fillSelect("m_train",200,39);


/* تقرير الرحلة */

fillSelect("s_b",450);
fillSelect("s_e",450);
fillSelect("s_w",20);
fillSelect("s_g",200);
fillSelect("s_s",150);


/* تقرير المحطات */

const stationIds=[
"r","d","j","h","ha","q","c","m","b"
];

stationIds.forEach(id=>{

fillSelect(id+"_b",450);
fillSelect(id+"_e",450);
fillSelect(id+"_w",20);
fillSelect(id+"_g",200);
fillSelect(id+"_s",150);

});


/* المحطات */

fillStations("s_from","Majmaah");
fillStations("s_to","Riyadh");


/* تاريخ اليوم */

const today=new Date().toISOString().split("T")[0];

document.getElementById("s_date").value=today;
document.getElementById("m_date").value=today;


/* تحديث تلقائي */

document.addEventListener("input",update);
document.addEventListener("change",update);

update();

</script>
