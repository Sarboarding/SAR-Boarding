<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAR - تقارير الركاب</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#111}
.app{max-width:650px;margin:auto;padding:14px}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 12px #00000014}
h1{text-align:center;font-size:21px;margin:0 0 15px}
h2{font-size:17px;margin:16px 0 10px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
button{border:0;border-radius:12px;padding:12px;font-size:16px;font-weight:700}
.tab{flex:1;background:#e6e9ed}.tab.active{background:#222;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;font-weight:700}
input,select{width:100%;margin-top:5px;padding:12px;border:1px solid #d5d9de;border-radius:10px;font-size:16px;background:#fff}
.full{grid-column:1/-1}
.station{border:1px solid #ddd;border-radius:13px;padding:12px;margin:10px 0}
.station-title{font-size:16px;font-weight:800;margin-bottom:9px}
.output{width:100%;min-height:330px;padding:13px;border:1px solid #ccc;border-radius:12px;font-size:15px;line-height:1.55;direction:ltr;text-align:left;white-space:pre-wrap;background:#fafafa}
.copy{width:100%;background:#128c7e;color:#fff;margin-top:10px}
.note{font-size:12px;color:#666;margin-top:8px;text-align:center}
.hidden{display:none}
</style>
</head>

<body>
<div class="app">
<div class="card">

<h1>🇸🇦 SAR — مولّد تقارير الركاب</h1>

<div class="tabs">
<button id="tab1" class="tab active" onclick="showSingle()">تقرير رحلة</button>
<button id="tab2" class="tab" onclick="showMulti()">تقرير المحطات</button>
</div>

<div id="single">
<div class="grid">

<label>التاريخ
<input id="s_date" type="date">
</label>

<label>رقم الرحلة
<select id="s_train"></select>
</label>

<label>من
<select id="s_from"></select>
</label>

<label>إلى
<select id="s_to"></select>
</label>

<label class="full">وقت المغادرة
<input id="s_time" type="time" value="22:30">
</label>

<label>Business
<select id="s_b"></select>
</label>

<label>Economy
<select id="s_e"></select>
</label>

<label>Waiting
<select id="s_w"></select>
</label>

<label>Baggage
<select id="s_g"></select>
</label>

<label>Shipment
<select id="s_s"></select>
</label>

</div>
</div>

<div id="multi" class="hidden">

<div class="grid">

<label>التاريخ
<input id="m_date" type="date">
</label>

<label>رقم الرحلة
<select id="m_train"></select>
</label>

<label class="full">وقت المغادرة
<input id="m_time" type="time" value="18:00">
</label>

</div>

<div class="station">
<div class="station-title">📍 بيانات الوجهة</div>

<div class="grid">

<label class="full">المحطة / الوجهة
<select id="m_station"></select>
</label>

<label>Business
<select id="m_b"></select>
</label>

<label>Economy
<select id="m_e"></select>
</label>

<label>Waiting
<select id="m_w"></select>
</label>

<label>Baggage
<select id="m_g"></select>
</label>

<label>Shipment
<select id="m_s"></select>
</label>

</div>
</div>
</div>

<h2>📱 النص الجاهز للواتساب</h2>

<textarea id="output" class="output" readonly></textarea>

<button class="copy" onclick="copyReport()">📋 نسخ النص</button>

<div id="status" class="note">
اضغط «نسخ النص» ثم الصق مباشرة في واتساب.
</div>

</div>
</div>

<script>

const stations=[
"Riyadh",
"Dammam",
"Al Jouf",
"Al Hofuf",
"Hail",
"Qassim",
"Al Qurayyat",
"Majmaah",
"Buqaiq"
];

function fillSelect(id,max,selected=0){
const x=document.getElementById(id);
for(let i=0;i<=max;i++){
let o=document.createElement("option");
o.value=i;
o.textContent=i;
if(i===selected)o.selected=true;
x.appendChild(o);
}
}

function fillStations(id,selected){
const x=document.getElementById(id);
stations.forEach(s=>{
let o=document.createElement("option");
o.value=s;
o.textContent=s;
if(s===selected)o.selected=true;
x.appendChild(o);
});
}

function v(id){
return document.getElementById(id).value||"";
}

function n(id){
return Number(v(id))||0;
}

function d(id){
let x=v(id);
if(!x)return "";
let p=x.split("-");
return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:x;
}

function singleText(){

let total=n("s_b")+n("s_e")+n("s_w");

return `🇸🇦 Saudi Arabia Railways (SAR)

📋 Departure Report
📍 ${v("s_from")} Station
${d("s_date")}

🚆 Train: #${v("s_train")}
➡️ ${v("s_from")} → ${v("s_to")}
🕖 Departure: ${v("s_time")}

👥 Passengers
💺 Business: ${n("s_b")}
🪑 Economy: ${n("s_e")}
Waiting: ${n("s_w")}
Total: ${total}

🧳 Baggage: ${n("s_g")}
📦 Shipment: ${n("s_s")}

📝 Note:
Baggage car is at the front of the train.`;
}

function multiText(){

let b=n("m_b");
let e=n("m_e");
let w=n("m_w");
let g=n("m_g");
let s=n("m_s");
let total=b+e+w;

return `🇸🇦 Saudi Arabia Railways (SAR)

📋 Passenger Destination Report
📍 Majmaah Station
${d("m_date")}

🚆 Train: #${v("m_train")}
🕕 Departure: ${v("m_time")}

👥 Passengers by Destination

📍 ${v("m_station")}
💺 Business: ${b}
🪑 Economy: ${e}
Waiting: ${w}
🧳 Baggage: ${g}
📦 Shipment: ${s}
Total: ${total}

👥 Total Passengers: ${total}
🧳 Total Baggage: ${g}
📦 Total Shipment: ${s}`;
}

function update(){

document.getElementById("output").value=
document.getElementById("multi").classList.contains("hidden")
?singleText()
:multiText();

}

function showSingle(){

document.getElementById("single").classList.remove("hidden");
document.getElementById("multi").classList.add("hidden");

document.getElementById("tab1").classList.add("active");
document.getElementById("tab2").classList.remove("active");

update();
}

function showMulti(){

document.getElementById("single").classList.add("hidden");
document.getElementById("multi").classList.remove("hidden");

document.getElementById("tab1").classList.remove("active");
document.getElementById("tab2").classList.add("active");

update();
}

async function copyReport(){

let text=document.getElementById("output").value;

try{

await navigator.clipboard.writeText(text);

document.getElementById("status").textContent=
"✅ تم النسخ كنص. افتح واتساب والصق.";

}catch(e){

let x=document.getElementById("output");

x.removeAttribute("readonly");
x.focus();
x.select();

document.execCommand("copy");

x.setAttribute("readonly","readonly");

document.getElementById("status").textContent=
"✅ تم النسخ كنص. افتح واتساب والصق.";

}
}


/* رقم القطارات من 0 إلى 200 */
fillSelect("s_train",200,39);
fillSelect("m_train",200,39);

/* أعداد الركاب */
fillSelect("s_b",450,0);
fillSelect("s_e",450,0);
fillSelect("s_w",20,0);
fillSelect("s_g",200,0);
fillSelect("s_s",150,0);

fillSelect("m_b",450,0);
fillSelect("m_e",450,0);
fillSelect("m_w",20,0);
fillSelect("m_g",200,0);
fillSelect("m_s",150,0);

/* المحطات */
fillStations("s_from","Majmaah");
fillStations("s_to","Riyadh");
fillStations("m_station","Majmaah");

/* تاريخ اليوم */
const today=new Date().toISOString().split("T")[0];
document.getElementById("s_date").value=today;
document.getElementById("m_date").value=today;

/* تحديث التقرير تلقائياً */
document.addEventListener("input",update);
document.addEventListener("change",update);

update();

</script>

</body>
</html>
