<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAR - تقارير الركاب</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#111}
.app{max-width:650px;margin:auto;padding:14px}
.card{background:white;border-radius:18px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:14px}
h1{font-size:21px;margin:0 0 15px;text-align:center}
h2{font-size:17px;margin:16px 0 10px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
button{border:0;border-radius:12px;padding:12px;font-size:16px;font-weight:700}
.tab{flex:1;background:#e6e9ed}.tab.active{background:#222;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;font-weight:700}
input{width:100%;margin-top:5px;padding:12px;border:1px solid #d5d9de;border-radius:10px;font-size:16px;background:#fff}
.full{grid-column:1/-1}
.station{border:1px solid #ddd;border-radius:13px;padding:12px;margin:10px 0}
.station-title{font-size:16px;font-weight:800;margin-bottom:9px}
.output{width:100%;min-height:330px;padding:13px;border:1px solid #ccc;border-radius:12px;font-size:15px;line-height:1.55;direction:ltr;text-align:left;white-space:pre-wrap;background:#fafafa}
.copy{width:100%;background:#128c7e;color:white;margin-top:10px}
.note{font-size:12px;color:#666;margin-top:8px;text-align:center}
.hidden{display:none}
.summary{font-weight:700;margin-top:8px}
</style>
</head>
<body>
<div class="app">
<div class="card">
<h1>🇸🇦 SAR — مولّد تقارير الركاب</h1>
<div class="tabs">
<button id="tab1" class="tab active" onclick="showSingle()">تقرير رحلة</button>
<button id="tab2" class="tab" onclick="showMulti()">تقرير المحطات</button>
</div>

<div id="single">
<div class="grid">
<label>التاريخ<input id="s_date" placeholder="08/08/2026"></label>
<label>رقم الرحلة<input id="s_train" placeholder="39"></label>
<label>من<input id="s_from" value="Majmaah"></label>
<label>إلى<input id="s_to" value="Riyadh"></label>
<label class="full">وقت المغادرة<input id="s_time" placeholder="22:30"></label>
<label>Business<input id="s_b" type="number" min="0" value="0"></label>
<label>Economy<input id="s_e" type="number" min="0" value="0"></label>
<label>Waiting<input id="s_w" type="number" min="0" value="0"></label>
<label>Baggage<input id="s_g" type="number" min="0" value="0"></label>
</div>
</div>

<div id="multi" class="hidden">
<div class="grid">
<label>التاريخ<input id="m_date" placeholder="11/08/2026"></label>
<label>رقم الرحلة<input id="m_train" placeholder="39"></label>
<label class="full">وقت المغادرة<input id="m_time" placeholder="18:00"></label>
</div>

<div class="station">
<div class="station-title">📍 Qassim</div>
<div class="grid">
<label>Business<input id="q_b" type="number" min="0" value="0"></label>
<label>Economy<input id="q_e" type="number" min="0" value="0"></label>
<label>Waiting<input id="q_w" type="number" min="0" value="0"></label>
<label>Baggage<input id="q_g" type="number" min="0" value="0"></label>
</div>
</div>

<div class="station">
<div class="station-title">📍 Hail</div>
<div class="grid">
<label>Business<input id="h_b" type="number" min="0" value="0"></label>
<label>Economy<input id="h_e" type="number" min="0" value="0"></label>
<label>Waiting<input id="h_w" type="number" min="0" value="0"></label>
<label>Baggage<input id="h_g" type="number" min="0" value="0"></label>
</div>
</div>

<div class="station">
<div class="station-title">📍 Al Jouf</div>
<div class="grid">
<label>Business<input id="j_b" type="number" min="0" value="0"></label>
<label>Economy<input id="j_e" type="number" min="0" value="0"></label>
<label>Waiting<input id="j_w" type="number" min="0" value="0"></label>
<label>Baggage<input id="j_g" type="number" min="0" value="0"></label>
</div>
</div>

<div class="station">
<div class="station-title">📍 Al Qurayyat</div>
<div class="grid">
<label>Business<input id="c_b" type="number" min="0" value="0"></label>
<label>Economy<input id="c_e" type="number" min="0" value="0"></label>
<label>Waiting<input id="c_w" type="number" min="0" value="0"></label>
<label>Baggage<input id="c_g" type="number" min="0" value="0"></label>
</div>
</div>
</div>

<h2>📱 النص الجاهز للواتساب</h2>
<textarea id="output" class="output" readonly></textarea>
<button class="copy" onclick="copyReport()">📋 نسخ النص</button>
<div id="status" class="note">اضغط «نسخ النص» ثم الصق مباشرة في واتساب.</div>
</div>
</div>

<script>
function v(id){return document.getElementById(id).value||""}
function n(id){return Number(v(id))||0}
function singleText(){
let t=n('s_b')+n('s_e')+n('s_w');
return `🇸🇦 Saudi Arabia Railways (SAR)

📋 Departure Report
📍 ${v('s_from')} Station
${v('s_date')}

🚆 Train: #${v('s_train')}
➡️ ${v('s_from')} → ${v('s_to')}
🕖 Departure: ${v('s_time')}

👥 Passengers
💺 Business: ${n('s_b')}
🪑 Economy: ${n('s_e')}
Waiting: ${n('s_w')}
Total: ${t}

🧳 Baggage: ${n('s_g')}

📝 Note:
Baggage car is at the front of the train.`;
}
function multiText(){
let rows=[
['Qassim','q_b','q_e','q_w','q_g'],
['Hail','h_b','h_e','h_w','h_g'],
['Al Jouf','j_b','j_e','j_w','j_g'],
['Al Qurayyat','c_b','c_e','c_w','c_g']];
let total=0,bags=0,body='';
rows.forEach(r=>{
let b=n(r[1]),e=n(r[2]),w=n(r[3]),g=n(r[4]),t=b+e+w;
total+=t;bags+=g;
body+=`📍 ${r[0]}
💺 Business: ${b}
🪑 Economy: ${e}
Waiting: ${w}
🧳 Baggage: ${g}
Total: ${t}

`;
});
return `🇸🇦 Saudi Arabia Railways (SAR)

📋 Passenger Destination Report
📍 Majmaah Station
${v('m_date')}

🚆 Train: #${v('m_train')}
🕕 Departure: ${v('m_time')}

👥 Passengers by Destination

${body}👥 Total Passengers: ${total}
🧳 Total Baggage: ${bags}`;
}
function update(){document.getElementById('output').value=document.getElementById('multi').classList.contains('hidden')?singleText():multiText();}
function showSingle(){document.getElementById('single').classList.remove('hidden');document.getElementById('multi').classList.add('hidden');document.getElementById('tab1').classList.add('active');document.getElementById('tab2').classList.remove('active');update();}
function showMulti(){document.getElementById('single').classList.add('hidden');document.getElementById('multi').classList.remove('hidden');document.getElementById('tab1').classList.remove('active');document.getElementById('tab2').classList.add('active');update();}
async function copyReport(){
let text=document.getElementById('output').value;
try{await navigator.clipboard.writeText(text);document.getElementById('status').textContent='✅ تم النسخ كنص. افتح واتساب والصق.';}
catch(e){let x=document.getElementById('output');x.removeAttribute('readonly');x.focus();x.select();document.execCommand('copy');x.setAttribute('readonly','readonly');document.getElementById('status').textContent='✅ تم النسخ كنص. افتح واتساب والصق.';}
}
document.addEventListener('input',update);
update();
</script>
</body>
</html>
